name: Populate YouTube Playlists

on:
  workflow_dispatch:
    inputs:
      station:
        description: "Station to populate"
        required: true
        default: "bbc6"

      start:
        description: "Starting row (0 = beginning)"
        required: true
        default: "0"

      limit:
        description: "Number of songs to process"
        required: true
        default: "5"

permissions:
  contents: read

jobs:
  populate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install google-auth google-auth-oauthlib google-api-python-client

      - name: Populate YouTube playlist
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python populate_youtube_playlists.py \
            "${{ inputs.station }}" \
            "${{ inputs.start }}" \
            "${{ inputs.limit }}"
